version: '3.8'
services:
  web:
    build: .
    container_name: mkspark_web
    ports:
      - "8080:80"
      - "1025:1025"  # MailHog SMTP port
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: mkspark_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mkspark_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mkspark_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

volumes:
  db_data:
